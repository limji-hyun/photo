<!DOCTYPE html>
<html lang="ko">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no">
    <title>3:4 프레임 카메라</title>
    <link rel="stylesheet" href="style.css">
</head>
<body>

    <div class="container">
        <h1>📸 Photo Booth</h1>
        
        <div class="photo-zone" id="photo-zone">
            <video id="video" autoplay playsinline muted></video>
            <img src="img.png" id="frame-img" class="frame-overlay" alt="프레임">
        </div>

        <div class="controls">
            <button id="start-btn">카메라 켜기</button>
            <button id="snap-btn" disabled>촬영 하기</button>
        </div>

        <div id="gallery">
            <div id="photos"></div>
        </div>
    </div>

    <canvas id="canvas" style="display:none;"></canvas>

    <script src="script.js"></script>
</body>
</html>
