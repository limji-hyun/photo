<!DOCTYPE html>
<html lang="ko">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no, viewport-fit=cover">
    <title>emtekinc Booth</title>
    <link rel="stylesheet" href="https://cdn.jsdelivr.net/gh/monada-dev/mona-font/dist/mona.css">
    <link rel="stylesheet" href="./style.css">
</head>
<body>

    <div class="container">
        <div id="home-screen" class="screen">
            <header>
                <div class="logo">📸</div>
                <h1>emtekinc Booth</h1>
                <p>특별한 순간을 기록하세요.<br>프레임과 함께 사진을 찍어보세요.</p>
            </header>
            <div class="home-controls">
                <button id="enter-btn" class="btn-primary">입장하기</button>
            </div>
        </div>

        <div id="booth-screen" class="screen" style="display:none;">
            <header>
                <h2 class="booth-title">📸 emtekinc Booth 📸</h2>
            </header>

            <div class="photo-wrapper">
                <div class="photo-zone" id="photo-zone">
                    <video id="video" autoplay playsinline muted></video>
                    <img id="preview-img" class="preview-overlay" alt="미리보기">
                    <div id="date-overlay" class="date-overlay"></div>
                    <img src="./img.png" id="frame-img" class="frame-overlay" alt="프레임">
                </div>
            </div>

            <div class="controls">
                <button id="snap-btn" class="btn-secondary">사진 찍기</button>
                
                <div id="preview-controls" style="display:none; width:100%; gap:12px; flex-direction:column;">
                    <button id="save-btn" class="btn-primary">이대로 저장하기</button>
                    <button id="retake-btn" class="btn-outline">다시 찍기</button>
                </div>
            </div>
        </div>
    </div>

    <canvas id="canvas" style="display:none;"></canvas>

    <script src="./script.js"></script>
</body>
</html>
